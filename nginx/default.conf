server {
    listen 80;
    server_name 46.225.146.179;

    root /var/www/html;
    index index.php index.html;

    # 1. Ocultar versión de Nginx en cabeceras de respuesta
    server_tokens off;

    # 2. Encabezados básicos de seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 3. Límite de tamaño para subida de archivos (ajusta según tus necesidades)
    client_max_body_size 20M;

    # 4. Enrutamiento principal
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 5. Evitar logs ruidosos para favicon y robots
    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    location = /robots.txt  { 
        access_log off; 
        log_not_found off; 
    }

    # 6. Procesamiento seguro de PHP-FPM
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Parámetros adicionales de conexión con FPM
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 60;
    }

    # 7. Bloquear acceso a archivos ocultos (.env, .git, .htaccess, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}